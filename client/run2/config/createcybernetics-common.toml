#Base Humanity Value
# Default: 100
# Range: 50 ~ 1000
humanity = 100
#Keep Cyberware on Death
#If true, cyberware will not drop and will persist through death.
keepCyberware = false
#Scale Surgery Damage
#If true, the surgery chamber will apply damage that scales with the amount of cyberware being removed.
#If false, the surgery chamber will apply 10 damage.
scaleSurgeryDamage = false
#Epilepsy Mode
#Activate this to disable the cyberware rejection overlay. Good if you or a friend has epilepsy.
epilepsyMode = false
#Tattoo Upload Mode
#SERVER_FILES_ONLY: Only PNGs manually placed in the server tattoo folder are available.
#OP_ONLY_AUTO_APPROVE: Only operators may upload tattoos, and uploads are immediately approved.
#ANY_PLAYER_PENDING_APPROVAL: Any player may upload tattoos, but uploads must be approved by an admin before appearing.
#ANY_PLAYER_AUTO_APPROVE: Any player may upload tattoos, and uploads are immediately approved. Not recommended for public servers.
#Allowed Values: SERVER_FILES_ONLY, OP_ONLY_AUTO_APPROVE, ANY_PLAYER_PENDING_APPROVAL, ANY_PLAYER_AUTO_APPROVE
tattooUploadMode = "OP_ONLY_AUTO_APPROVE"
