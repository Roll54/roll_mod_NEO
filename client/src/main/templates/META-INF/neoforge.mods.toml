modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id_client}"
version = "${mod_version}"
displayName = "${mod_name} (Client)"
authors = "${mod_authors}"
description = '''${mod_description} — client-side renderers, screens and key bindings. Requires ${mod_id}.'''

[[mixins]]
config = "${mod_id_client}.mixins.json"

# JEI fluid tooltips: adds the minimal price line. Soft because JEI is optional; without it the
# target class is missing and the mixin is skipped.
[[mixins]]
config = "${mod_id_client}.jei.mixins.json"

# Fusion block model modifiers on MI machines: defers the wrapped model's particle lookup (MI machines
# resolve their casing model, which throws mid-bake and fails the reload) and feeds the block entity's
# model data through Fusion's Sodium path (otherwise machines always face north). MachineBakedModelMixin
# lets MI machine casings render as Fusion connecting models (keeps machine model data, asks for all casing
# quads) so resource-pack connected casings join machines. Soft, and the config
# plugin skips it entirely unless Fusion is loaded.
[[mixins]]
config = "${mod_id_client}.fusion.mixins.json"

# Requires the common jar — client will not load without it.
[[dependencies."${mod_id_client}"]]
modId = "${mod_id}"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id_client}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id_client}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# The client mixin config is required = true and one of its mixins targets GeckoLib
# (skin.GeoArmorSkinMixin, which makes cosmetic helmet skins render on any helmet). Without GeckoLib
# present that mixin's target class is missing and the game would fail to start with a mixin error
# rather than a readable dependency message, so state the dependency outright.
[[dependencies."${mod_id_client}"]]
modId = "geckolib"
type = "required"
versionRange = "[4.8,)"
ordering = "BEFORE"
side = "CLIENT"
