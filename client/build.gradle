base {
    archivesName = mod_id_client
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        // this jar's own mod
        "${mod_id_client}" {
            sourceSet(sourceSets.main)
        }
        // the common mod, so dev runs owned by this project load it too
        "${mod_id}" {
            sourceSet(project(':common').sourceSets.main)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}", mods."${mod_id_client}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--username'
            programArgument 'TestPlayer'
        }
        // A second client, for everything that needs two players on the dev server at once: seeing
        // someone else's warp and paying its price, buying another player's auction listing, and
        // party-scaled daily tasks. Its own game directory, because two clients sharing one would
        // race on options.txt, the log and the screenshot folder.
        client2 {
            client()
            loadedMods = [mods."${mod_id}", mods."${mod_id_client}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = file('run2')
            programArgument '--username'
            programArgument 'TestPlayer2'
        }
        data {
            data()
            loadedMods = [mods."${mod_id}", mods."${mod_id_client}"]
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('../common/src/generated/resources/').getAbsolutePath(),
                    '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    implementation project(':common')

    // compileOnly: GuiGraphicsOxygenBarMixin reads the nano suit's oxygen tank for rendering. These
    // classes are provided at runtime by the loaded mods (common exposes them non-transitively, so
    // they must be named explicitly here for compilation).
    compileOnly files("../common/jars/adastra-1.21.1-1.16.6-neoforge.jar")
    compileOnly files("../common/jars/common-storage-lib-neoforge-1.21.1-0.0.9.jar")
    compileOnly files("../common/jars/common-storage-lib-resources-neoforge-1.21.1-0.0.9.jar")

    // compileOnly: CyberwareSkinLayer reads createcybernetics' synced PlayerCyberwareData to draw
    // roll_mod cyberware overlays on the player. Common depends on this jar non-transitively (as
    // implementation), so it must be named explicitly here for compilation; loaded at runtime.
    compileOnly files("../common/jars/createcybernetics-0.4.8b-neoforge-1.21.1-PLAYTEST-PRERELEASE-4.jar")
    compileOnly "curse.maven:extended-industrialization-1068418:7722451"

    // compileOnly: AnvilTooExpensiveLabelMixin reads ModConfigs.MAIN.anvil.removeLevelCap, whose
    // getter returns through fzzy_config's ValidatedBoolean. Common exposes it non-transitively.
    compileOnly "me.fzzyhmstrs:fzzy_config:0.7.3+1.21+neoforge"

    // JEI is client-only.
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // AgriCraft (a common-module api dependency) requires resourcefulconfig at runtime.
    // The data run doesn't read run/mods, so put it on the dev-run classpath for datagen.
    runtimeOnly files("../run/mods/resourcefulconfig-neoforge-1.21-3.0.11.jar")



    // Soft dependency of :common's daily-tasks system; present at dev runtime so party
    // scaling can actually be tested. Not on any compile classpath here.
    runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:${mixinextras_version}")) {
        version {
            strictly "[${mixinextras_version},)"
            prefer mixinextras_version
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_id_client          : mod_id_client,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The economy's SQL stack is compileOnly in :common and shaded into the :server jar, so it is on no
// classpath the dev client can see — and a singleplayer world runs an integrated server that opens
// the currency database. Add it to the run only; the shipped client jar deliberately has no driver.
['client', 'client2', 'data'].each { runName ->
    def runCfg = neoForge.runs.getByName(runName).additionalRuntimeClasspathConfiguration
    dbLibs.each { dependencies.add(runCfg.name, it) }
    // Open Parties and Claims backs plot ownership and :common only compiles against it, so the run
    // needs its own copy or PlotService throws NoClassDefFoundError the first time plots are opened.
    // The Xaero maps are its usual companions and make the plot map worth looking at.
    dependencies.add(runCfg.name, files("../common/jars/open-parties-and-claims-neoforge-1.21.1-0.27.5.jar"))
    dependencies.add(runCfg.name, files("../common/jars/xaerominimap-neoforge-1.21.1-26.1.0.jar"))
    dependencies.add(runCfg.name, files("../common/jars/xaeroworldmap-neoforge-1.21.1-1.41.2.jar"))}
