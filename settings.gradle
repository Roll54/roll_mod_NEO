pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'roll_mod'

include 'common'
include 'client'
include 'server'
// The loading screen shown before any mod loads — a separate jar, see earlywindow/build.gradle.
include 'earlywindow'
