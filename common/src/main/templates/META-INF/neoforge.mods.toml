# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the the FML version. This is currently 47.
loaderVersion = "${loader_version_range}" #mandatory
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license = "${mod_license}"
# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId = "${mod_id}" #mandatory
# The version number of the mod
version = "${mod_version}" #mandatory
# A display name for the mod
displayName = "${mod_name}" #mandatory
# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforge.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="roll_mod.png" #optional
# A text field displayed in the mod UI
#credits="" #optional
# A text field displayed in the mod UI
authors = "${mod_authors}" #optional

# The description text for the mod (multi line!) (#mandatory)
description = '''${mod_description}'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config = "${mod_id}.mixins.json"

# Kept apart from the config above because ftbteams is a soft dependency: this one is
# required = false, so if the mod is absent its target class is missing, the mixin is skipped, and
# nothing crashes. The config above is required = true and would take the game down instead.
[[mixins]]
config = "${mod_id}.ftbteams.mixins.json"

# Same soft shape for Farmer's Delight: the daily-task cooking hooks target its classes.
[[mixins]]
config = "${mod_id}.farmersdelight.mixins.json"

# Create Cybernetics, soft as well, and with defaultRequire = 0 on top: the shipped build is a
# PLAYTEST PRERELEASE, so its internals are expected to move. A renamed target should cost us the
# optimisation, not the server.
[[mixins]]
config = "${mod_id}.createcybernetics.mixins.json"

# Functional Storage, soft for the same reason: a pure performance mixin over its drawer controller.
# Nothing else in this mod touches the mod, so if it is absent there is simply nothing to patch.
[[mixins]]
config = "${mod_id}.functionalstorage.mixins.json"

# MI's FTB Quests submit path. Soft even though MI is effectively required here: the declared range
# spans 2.4 to 2.6, and this is an optimisation, so a moved call site should not be a boot failure.
[[mixins]]
config = "${mod_id}.mi_ftbquests.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies."${mod_id}"]] #optional
# the modid of the dependency
modId = "neoforge" #mandatory
# The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
# 'required' requires the mod to exist, 'optional' does not
# 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
type = "required" #mandatory
# Optional field describing why the dependency is required or why it is incompatible
# reason="..."
# The version range of the dependency
versionRange = "${neo_version_range}" #mandatory
# An ordering relationship for the dependency.
# BEFORE - This mod is loaded BEFORE the dependency
# AFTER - This mod is loaded AFTER the dependency
ordering = "NONE"
# Side this dependency is applied on - BOTH, CLIENT, or SERVER
side = "BOTH"
# Here's another dependency
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Modern Industrialization is optional only in the loader's eyes -- what matters here is the
# ordering. MI registers its casings and machines in its own constructor, so this mod has to be
# constructed after it for MachineModelRegistry to resolve a casing by name.
[[dependencies."${mod_id}"]]
modId = "modern_industrialization"
type = "optional"
versionRange = "${mi_version_range}"
ordering = "AFTER"
side = "BOTH"

# ordering. Tesseract runs its MI hook listeners one mod at a time -- every phase of a listener
# before the next mod's listener -- sorted by mod load order. MachineRegistry#recipeTypes reads
# recipe types that Extended Industrialization registers from its own listener, so this mod has to
# come after it or those lookups resolve to nothing.
[[dependencies."${mod_id}"]]
modId = "extended_industrialization"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Farmer's Delight adds the daily cooking tasks. Optional; the range is where the mixin targets were
# checked (CookingPotResultSlot, CookingPotBlock.useItemOn, SkilletItem's finishUsingItem lambda).
[[dependencies."${mod_id}"]]
modId = "farmersdelight"
type = "optional"
versionRange = "[1.3.2,)"
ordering = "NONE"
side = "BOTH"

# Functional Storage carries a performance mixin only (ControllerInventoryHandler's per-slot
# staleness check). Optional, and the range records where the targets were read: 1.5.8.
[[dependencies."${mod_id}"]]
modId = "functionalstorage"
type = "optional"
versionRange = "[1.5.8,)"
ordering = "NONE"
side = "BOTH"

# Create Cybernetics likewise carries only the cyberware sync-throttle mixin.
[[dependencies."${mod_id}"]]
modId = "createcybernetics"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

# Multiblocked2 and its UI library are hard dependencies, not soft ones: compat/MBD2 imports
# com.lowdragmc.* directly with no ModList.isLoaded guard (the crop_manager_mk2 machine, the
# mi_energy_storage and crop_harvester traits), and the economy/hub UIs are built on LdLib2. Without
# these the mod does not class-load, so the loader should say so instead of letting it crash.
[[dependencies."${mod_id}"]]
modId = "mbd2"
# [21.1,) not [21.0.11,): MBD2 21.1 replaced IAutoIOTrait#getAutoIO with #getRuntimeAutoIO, so the
# mi_energy_storage trait built against 21.1 throws AbstractMethodError on every machine tick under
# 21.0.x. Not [21.1.1,) either, for the reason spelled out under ldlib2 below: the shipped build is
# "21.1.1.a", and a trailing qualifier sorts BEFORE the bare release, so it would not satisfy it.
type = "required"
versionRange = "[21.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ldlib2"
# [2.2,) not [2.2.39,): the shipped version is "2.2.39.a", and Maven ordering treats a trailing
# qualifier as older than the bare release, so "2.2.39.a" does NOT satisfy "[2.2.39,)".
type = "required"
versionRange = "[2.2,)"
ordering = "AFTER"
side = "BOTH"

# Same story: compat/argicraft and mixin/crops name AgriCraft classes unguarded, and
# roll_mod.mixins.json is required = true with four mixins targeting them.
[[dependencies."${mod_id}"]]
modId = "agricraft"
type = "required"
versionRange = "[4.0.8,)"
ordering = "AFTER"
side = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features."${mod_id}"]
#openGLVersion="[3.2,)"
