import groovy.json.JsonOutput
import groovy.json.JsonSlurper

base {
    archivesName = mod_id
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// src/main/resources and src/generated/resources both hold assets/<mod_id>/lang/<locale>.json, which
// collide on the same jar path. processResources uses DuplicatesStrategy.EXCLUDE (see the root build
// script), so it would keep only src/main's copy and drop every datagen'd translation. Merge the two
// instead: the raw files are filtered out of the source set and mergeLangFiles supplies the union.
var mergeLangFiles = tasks.register("mergeLangFiles", MergeLangFiles) {
    // Order is precedence: later directories override earlier ones on a key clash.
    sourceLangDirs.from layout.projectDirectory.dir("src/generated/resources/assets/${mod_id}/lang")
    sourceLangDirs.from layout.projectDirectory.dir("src/main/resources/assets/${mod_id}/lang")
    // Not a language code, just an archive of translations datagen has taken over.
    ignoredFiles = ["old_datagen.json"] as Set
    namespace = mod_id
    outputDir = layout.buildDirectory.dir("generated/sources/mergedLang")
}

sourceSets.main.resources.exclude "assets/${mod_id}/lang/*.json"
tasks.named('processResources') { from mergeLangFiles }
neoForge.ideSyncTask mergeLangFiles

dependencies {
    implementation "me.fzzyhmstrs:fzzy_config:0.7.3+1.21+neoforge"

    // Exposed as api so the client and server subprojects inherit them transitively.
    api "aztech:Modern-Industrialization:${modern_industrialization_version}"
    api "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolibVersion}"
    api files("jars/AgriCraft-neoforge-1.21.1-4.0.8.jar")

    implementation "dev.technici4n:GrandPower:${grandpower_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    implementation "curse.maven:rhino-416294:7104526"
    implementation "curse.maven:guideme-1173950:6812025"
    implementation files("jars/adastra-1.21.1-1.16.6-neoforge.jar")

    // compileOnly: NanoArmorMixin implements FluidProvider from common_storage_lib.
    // Provided at runtime by the common_storage_lib mod, so not bundled.
    // FluidResource and other API types live in nested jar-in-jar modules that
    // Gradle won't unpack from the main jar, so they're referenced explicitly.
    compileOnly files("jars/common-storage-lib-neoforge-1.21.1-0.0.9.jar")
    compileOnly files("jars/common-storage-lib-resources-neoforge-1.21.1-0.0.9.jar")
    compileOnly files("jars/common-storage-lib-data-neoforge-1.21.1-0.0.9.jar")
    compileOnly files("jars/common-storage-lib-lookup-neoforge-1.21.1-0.0.9.jar")

    // Runtime-only libraries required by ad_astra / agricraft (declared above). They must be present
    // at runtime or the dev client/server crash with "Mod ad_astra requires resourcefullib/...".
    // runtimeOnly keeps them off the compile classpath and out of any published jar; the client and
    // server dev runs inherit them through `implementation project(':common')`.
    runtimeOnly files("jars/common-storage-lib-neoforge-1.21.1-0.0.9.jar")
    runtimeOnly files("../run/mods/resourcefulconfig-neoforge-1.21-3.0.11.jar")
    runtimeOnly files("../run/mods/resourcefullib-neoforge-1.21-3.0.12.jar")

    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:${mixinextras_version}")) {
        version {
            strictly "[${mixinextras_version},)"
            prefer mixinextras_version
        }
    }

    implementation "curse.maven:tesseract-api-neoforge-1067672:7796728"
    implementation "curse.maven:kubejs-238086:7143884"
    implementation "curse.maven:mi-tweaks-1068413:7722383"
    implementation "curse.maven:extended-industrialization-1068418:7722451"
    implementation "curse.maven:crafttweaker-239197:6929483"

    // compileOnly: the daily-tasks system reads FTB party membership through
    // com.roll_54.roll_mod.compat.ftb.FTBTeamsFacadeImpl, which is only ever class-loaded when
    // ftbteams is present. Keeping it off the runtime classpath keeps the dependency soft.
    implementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    api jarJar("dev.technici4n:GrandPower:${project.grandpower_version}")

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all")

    implementation "curse.maven:architectury-api-419699:5786327"

    implementation files("jars/createcybernetics-0.4.8b-neoforge-1.21.1-PLAYTEST-PRERELEASE-4.jar")

    // Functional Storage is here only so compat/functionalstorage/mixin can name
    // ControllerInventoryHandler. Nothing else in this mod references it and the mixin config is
    // required = false, so it stays soft; implementation rather than compileOnly so the dev runs
    // have a drawer controller to test the mixin against. Titanium is its own hard dependency --
    // without it the dev server refuses to start -- and is runtimeOnly because nothing compiles
    // against it.
    implementation files("jars/functionalstorage-1.21.1-1.5.8.jar")
    runtimeOnly files("jars/titanium-1.21-4.0.45.jar")

    implementation files("jars/Multiblocked2-1.21-1.21.1-21.1.2-all.jar")

    /* ------------------------------------- economy (ex roll_mod_currency) ------------------------------------- */

    // FTB Quests backs the currency task and reward types in economy/api/ftb. Still soft at
    // runtime — RollMod only touches those classes behind ModList.isLoaded("ftbquests") — but
    // declared implementation like Teams so the dev runs have it to test against.
    implementation "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"

    // Open Parties and Claims owns plot claims; PlotService imports xaero.pac.* directly and calls
    // it with no isLoaded guard, so it is a hard dependency at both compile and run time. The Xaero
    // map mods are runtime-only companions — nothing here compiles against them.
    compileOnly files("jars/open-parties-and-claims-neoforge-1.21.1-0.27.5.jar")

    // Optional-mod integrations. compileOnly keeps them soft: the integration classes are only ever
    // loaded when the mod in question is present.
    compileOnly "dev.emi:emi-neoforge:1.1.24+1.21.1:api"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:26.2.820"
    compileOnly "curse.maven:jade-324717:7545219"
    compileOnly "curse.maven:carry-on-274259:7393892"
    compileOnly "net.luckperms:api:5.4"

    // Farmer's Delight: daily-task COOK hook. implementation, not compileOnly, so every dev run loads it
    // and the cooking tasks can be tested out of the box. Still soft for the shipped mod: only the
    // mixins in compat/farmersdelight name its classes, their config is required = false, and
    // neoforge.mods.toml lists it as optional.
    implementation files("jars/FarmersDelight-1.21.1-1.3.2.jar")

    // Currency balances live in an external SQL database, and this is the only module that names
    // the driver stack — CurrencyRepository, DatabaseManager and SchemaMigrator all reference
    // org.jdbi, com.zaxxer.hikari and org.flywaydb directly. So this is the module that ships it.
    //
    // Jar-in-jar rather than a shade, deliberately. These packages are baked into *this* module's
    // compiled bytecode, and a relocating shade only rewrites the classes it packages — which is
    // precisely the bug this replaces: :server shaded them and relocated org.jdbi to
    // com.roll_54.roll_mod.shadow.jdbi, a name the already-compiled classes in roll_mod.jar had
    // never heard of, so every currency lookup died with NoClassDefFoundError the moment a player
    // joined. Dev runs never caught it because they add these unrelocated to the run classpath.
    // The strictly block is not optional: jar-in-jar resolves embedded libraries by version range,
    // and a dependency with no constraint is dropped from the bundle without a word — which is how
    // the first attempt at this produced a jar with no database stack in it at all.
    dbLibs.forEach { lib ->
        var coords = lib.tokenize(':')
        jarJar(implementation(lib)) {
            version { strictly coords[2] }
            // Both are already on the game's own classpath, and a bundled second copy turns their
            // packages into split packages across two modules.
            exclude group: "org.slf4j", module: "slf4j-api"
            exclude group: "com.google.code.gson", module: "gson"
        }
    }
}




var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             mi_version_range       : modern_industrialization_version_range]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

/**
 * Merges the language files that several resource roots contribute to the same jar path into one
 * file per locale, so hand-written and datagen'd translations can coexist.
 */
abstract class MergeLangFiles extends DefaultTask {
    /** Directories holding &lt;locale&gt;.json files. Later entries win on a key clash. */
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSourceLangDirs()

    /** File names in those directories that are not language files and must not be merged. */
    @Input
    abstract SetProperty<String> getIgnoredFiles()

    /** Resource namespace the merged files are written under. */
    @Input
    abstract Property<String> getNamespace()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void merge() {
        var ignored = ignoredFiles.get()
        var dirs = sourceLangDirs.files.findAll { it.directory }
        var locales = dirs.collectMany { dir ->
            dir.listFiles().findAll { it.file && it.name.endsWith('.json') && !ignored.contains(it.name) }*.name
        } as TreeSet

        var outDir = outputDir.get().dir("assets/${namespace.get()}/lang").asFile
        outDir.listFiles()?.each { it.delete() }
        outDir.mkdirs()

        var slurper = new JsonSlurper()
        locales.each { name ->
            var merged = new LinkedHashMap<String, Object>()
            dirs.each { dir ->
                var file = new File(dir, name)
                if (file.file) {
                    merged.putAll(slurper.parse(file, 'UTF-8') as Map)
                }
            }
            new File(outDir, name).setText(toPrettyJson(merged), 'UTF-8')
            logger.info("Merged {} translation keys into {}", merged.size(), name)
        }
    }

    /**
     * Same 2-space layout as the source lang files, but keeps text as UTF-8 instead of the \\uXXXX
     * escapes JsonOutput emits, which more than doubles the size of a Cyrillic file.
     */
    static String toPrettyJson(Map<String, Object> map) {
        var out = new StringBuilder("{\n")
        map.eachWithIndex { key, value, index ->
            out.append('  ').append(quote(key)).append(': ')
            out.append(value instanceof String ? quote(value) : JsonOutput.toJson(value))
            out.append(index < map.size() - 1 ? ',\n' : '\n')
        }
        return out.append("}\n").toString()
    }

    static String quote(String text) {
        var out = new StringBuilder('"')
        text.each { String c ->
            switch (c) {
                case '"' -> out.append('\\"')
                case '\\' -> out.append('\\\\')
                case '\b' -> out.append('\\b')
                case '\f' -> out.append('\\f')
                case '\n' -> out.append('\\n')
                case '\r' -> out.append('\\r')
                case '\t' -> out.append('\\t')
                default -> c.codePointAt(0) < 0x20 ? out.append(String.format('\\u%04x', c.codePointAt(0))) : out.append(c)
            }
        }
        return out.append('"').toString()
    }
}
