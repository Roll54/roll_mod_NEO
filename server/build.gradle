apply plugin: 'com.gradleup.shadow'

base {
    archivesName = mod_id_server
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id_server}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}" {
            sourceSet(project(':common').sourceSets.main)
        }
    }

    runs {
        server {
            server()
            loadedMods = [mods."${mod_id}", mods."${mod_id_server}"]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArguments = ["-Xmx16G", "-XX:+UseZGC"]
        }
        gameTestServer {
            type = "gameTestServer"
            loadedMods = [mods."${mod_id}", mods."${mod_id_server}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    implementation project(':common')

//    implementation "curse.maven:ftb-library-forge-404465:${ftb_library_file}"

    implementation files("jars/luckperms-neoforge.jar")
    implementation files("jars/minestar-neoforge-1.1.0-all.jar")
    runtimeOnly files("jars/tab.jar")

    // compileOnly: needed so GasTankItemMixin can reference StorageIO in its @WrapOperation
    // handler signature. Provided at runtime by the common_storage_lib mod, so not bundled.
    compileOnly files("jars/common-storage-lib-neoforge-1.21.1-0.0.9.jar")

    // Soft dependency of :common's daily-tasks system; present at dev runtime so party
    // scaling can actually be tested. Not on any compile classpath here.
    implementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    // ChatHandler reads FTBEPlayerData for the mute/nickname state it prints.

    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:${mixinextras_version}")) {
        version {
            strictly "[${mixinextras_version},)"
            prefer mixinextras_version
        }
    }

    shadow("net.kyori:adventure-text-minimessage:4.17.0")
    api("net.kyori:adventure-text-minimessage:4.17.0")
    shadow("net.kyori:adventure-text-serializer-gson:4.17.0")
    api("net.kyori:adventure-text-serializer-gson:4.17.0")

    // No dbLibs here. The currency code lives in :common and so does the bundle now — this module
    // does not name a single class from that stack. Shading them here shipped a copy relocated to
    // com.roll_54.roll_mod.shadow.*, which :common's already-compiled bytecode could never resolve.

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all")

    implementation files("jars/Multiblocked2-1.21-1.21.1-21.1.2-all.jar")

}

// The Adventure/MiniMessage libraries are only bundled into the PRODUCTION shadowJar (via the
// `shadow` configuration, relocated to com.prostomaslo.libs.net.kyori). They are therefore absent
// from the dev run's game classpath, so code that touches MiniMessage (e.g. PvpManager on player
// join) crashes with NoClassDefFoundError. Add them, unrelocated (matching the un-relocated
// references in the dev classes), to each run's additional runtime classpath. This affects dev runs
// only and does not change the shadowJar (which uses just the `shadow` configuration).
['server', 'gameTestServer'].each { runName ->
    def runCfg = neoForge.runs.getByName(runName).additionalRuntimeClasspathConfiguration
    dependencies.add(runCfg.name, "net.kyori:adventure-text-minimessage:4.17.0")
    dependencies.add(runCfg.name, "net.kyori:adventure-text-serializer-gson:4.17.0")
    // Same reasoning for the economy's SQL stack: shaded into the production jar, so absent from
    // the dev run unless it is added here. Without it DatabaseManager fails on ServerStarting.
    dbLibs.each { dependencies.add(runCfg.name, it) }
    // Open Parties and Claims owns plot claims, and :common only compiles against it. The server is
    // where PlotService actually runs, so without this every plot command throws.
    dependencies.add(runCfg.name, files("../common/jars/open-parties-and-claims-neoforge-1.21.1-0.27.5.jar"))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_id_server          : mod_id_server,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.shadowJar {
    configurations = [project.configurations.getByName("shadow")]
    // JDBC drivers and Flyway both resolve through META-INF/services, so the entries have to be
    // merged rather than let one bundled jar's copy win.
    mergeServiceFiles()
    relocate("net.kyori", "com.prostomaslo.libs.net.kyori")
    relocate("com.google.gson", "com.prostomaslo.libs.com.google.gson")

    // The SQL stack is no longer shaded here at all, so it needs no relocations — see the
    // dependencies block. Relocating it was what broke it: shadow rewrites references only in the
    // classes it packages, and the code that names these packages is in a different jar.
    //
    // NeoForge provides SLF4J. Bundling the transitive copy the remaining shaded libraries drag in
    // makes org.slf4j.helpers a split package, exported by both this mod and the real module.
    exclude 'org/slf4j/**'
}
