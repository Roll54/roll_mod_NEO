apply plugin: 'com.gradleup.shadow'

// Optional jars: the Minestar mod and DimThreads. Without one in jars/, the classes that need it are left out of the
// build (below), and the jar builds and runs without that feature (RollModServer loads them only when present).
ext.minestarJar = file("jars/minestar-neoforge-1.5.0-all.jar")
ext.dimthreadJar = file("jars/dimthread-NEOFORGE-mc1.21.1-v1.3.1.jar")
ext.hasMinestar = minestarJar.exists()
ext.hasDimthread = dimthreadJar.exists()
if (!hasMinestar) logger.lifecycle("[roll_mod_server] {} not found: building without the Minestar integration", minestarJar.name)
if (!hasDimthread) logger.lifecycle("[roll_mod_server] {} not found: building without the DimThreads crash guard", dimthreadJar.name)

sourceSets.main.java {
    if (!hasMinestar) {
        exclude 'com/roll_54/roll_mod_server/minestar/MinestarFriendsProvider.java'
        exclude 'com/roll_54/roll_mod_server/minestar/PrimeSync.java'
        exclude 'com/roll_54/roll_mod_server/minestar/Shop*.java'
        exclude 'com/roll_54/roll_mod_server/mixin/minestar/**'
    }
    if (!hasDimthread) exclude 'com/roll_54/roll_mod_server/crash/DimThreadsGuard.java'
}

// The Minestar mixin is listed in the mixin config; without its class, the line goes too.
processResources {
    if (!hasMinestar) {
        filesMatching('*.mixins.json') {
            filter { String line -> line.contains('minestar.MinestarConfigValidateMixin') ? null : line }
        }
    }
}

base {
    archivesName = mod_id_server
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id_server}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}" {
            sourceSet(project(':common').sourceSets.main)
        }
    }

    runs {
        server {
            server()
            loadedMods = [mods."${mod_id}", mods."${mod_id_server}"]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArguments = ["-Xmx16G", "-XX:+UseZGC"]
            // ./gradlew :server:runServer -PmixinAudit makes DimThreads load every class it patches at startup, so a
            // compat mixin that no longer fits its target (after updating MI, AE2, Ad Astra...) fails at boot, with a
            // "Mixin self-check" line in the log, instead of in play.
            if (project.hasProperty('mixinAudit')) {
                systemProperty 'dimthread.verifyMixins', 'true'
            }
        }
        gameTestServer {
            type = "gameTestServer"
            loadedMods = [mods."${mod_id}", mods."${mod_id_server}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

dependencies {
    implementation project(':common')

//    implementation "curse.maven:ftb-library-forge-404465:${ftb_library_file}"

    // The API from Maven Central is enough to compile against (common uses the same one), so a
    // checkout without the local LuckPerms jar still builds. The jar is what the dev server runs.
    compileOnly "net.luckperms:api:5.4"
    implementation files("jars/luckperms-neoforge.jar")
    if (hasMinestar) implementation files(minestarJar)
    runtimeOnly files("jars/tab.jar")

    // compileOnly: needed so GasTankItemMixin can reference StorageIO in its @WrapOperation
    // handler signature. Provided at runtime by the common_storage_lib mod, so not bundled.
    compileOnly files("jars/common-storage-lib-neoforge-1.21.1-0.0.9.jar")

    // DimThreads (Minestar fork, built from ../dimthreads): ticks dimensions in parallel and carries the thread-safety
    // fixes for MI, EI, Tesseract, AE2, Advanced AE, Ad Astra and Multiblocked2. A required dependency of this jar
    // (neoforge.mods.toml); compiled against for its API (crash/DimThreadsGuard) and loaded by the dev server runs.
    // Replace the jar here when the fork is rebuilt.
    if (hasDimthread) implementation files(dimthreadJar)

    // Soft dependency of :common's daily-tasks system; present at dev runtime so party
    // scaling can actually be tested. Not on any compile classpath here.
    implementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    // ChatHandler reads FTBEPlayerData for the mute/nickname state it prints.

    jarJar(implementation("io.github.llamalad7:mixinextras-neoforge:${mixinextras_version}")) {
        version {
            strictly "[${mixinextras_version},)"
            prefer mixinextras_version
        }
    }

    shadow("net.kyori:adventure-text-minimessage:4.17.0")
    api("net.kyori:adventure-text-minimessage:4.17.0")
    shadow("net.kyori:adventure-text-serializer-gson:4.17.0")
    api("net.kyori:adventure-text-serializer-gson:4.17.0")

    // No dbLibs here. The currency code lives in :common and so does the bundle now — this module
    // does not name a single class from that stack. Shading them here shipped a copy relocated to
    // com.roll_54.roll_mod.shadow.*, which :common's already-compiled bytecode could never resolve.

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all")

    implementation files("jars/Multiblocked2-1.21-1.21.1-21.1.2-all.jar")

}

// The Adventure/MiniMessage libraries are only bundled into the PRODUCTION shadowJar (via the
// `shadow` configuration, relocated to com.prostomaslo.libs.net.kyori). They are therefore absent
// from the dev run's game classpath, so code that touches MiniMessage (e.g. PvpManager on player
// join) crashes with NoClassDefFoundError. Add them, unrelocated (matching the un-relocated
// references in the dev classes), to each run's additional runtime classpath. This affects dev runs
// only and does not change the shadowJar (which uses just the `shadow` configuration).
['server', 'gameTestServer'].each { runName ->
    def runCfg = neoForge.runs.getByName(runName).additionalRuntimeClasspathConfiguration
    dependencies.add(runCfg.name, "net.kyori:adventure-text-minimessage:4.17.0")
    dependencies.add(runCfg.name, "net.kyori:adventure-text-serializer-gson:4.17.0")
    // Same reasoning for the economy's SQL stack: shaded into the production jar, so absent from
    // the dev run unless it is added here. Without it DatabaseManager fails on ServerStarting.
    dbLibs.each { dependencies.add(runCfg.name, it) }
    // Open Parties and Claims owns plot claims, and :common only compiles against it. The server is
    // where PlotService actually runs, so without this every plot command throws.
    dependencies.add(runCfg.name, files("../common/jars/open-parties-and-claims-neoforge-1.21.1-0.27.5.jar"))
    // Sophisticated Core supplies the liquid XP (sophisticatedcore:xp_still) the service block's XP
    // services trade in. Test runs only; nothing compiles against it.
    dependencies.add(runCfg.name, files("../common/jars/sophisticatedcore-1.21.1-1.5.5.2363.jar"))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_id_server          : mod_id_server,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             // DimThreads: required when this jar was built with it, optional otherwise.
                             dimthread_dependency   : hasDimthread ? "required" : "optional"]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.shadowJar {
    configurations = [project.configurations.getByName("shadow")]
    // JDBC drivers and Flyway both resolve through META-INF/services, so the entries have to be
    // merged rather than let one bundled jar's copy win.
    mergeServiceFiles()
    relocate("net.kyori", "com.prostomaslo.libs.net.kyori")
    relocate("com.google.gson", "com.prostomaslo.libs.com.google.gson")

    // The SQL stack is no longer shaded here at all, so it needs no relocations — see the
    // dependencies block. Relocating it was what broke it: shadow rewrites references only in the
    // classes it packages, and the code that names these packages is in a different jar.
    //
    // NeoForge provides SLF4J. Bundling the transitive copy the remaining shaded libraries drag in
    // makes org.slf4j.helpers a split package, exported by both this mod and the real module.
    exclude 'org/slf4j/**'
}
