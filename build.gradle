plugins {
    id 'net.neoforged.moddev' version '2.0.107' apply false
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'idea'
    apply plugin: 'net.neoforged.moddev'

    version = mod_version
    group = mod_group_id

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    // The SQL stack behind the economy's currency balances. :common compiles against it and bundles
    // it (see common/build.gradle), and the dev runs put it on their run classpaths — so the one
    // list lives here rather than being repeated across the build scripts.
    //
    // The transitive dependencies are spelled out rather than left to Gradle, because jar-in-jar
    // embeds only what is named: a transitive resolved on the compile classpath is present at build
    // time and simply absent at runtime. geantyref is the one that bites — jdbi3-core reaches for it
    // the first time it resolves a generic type, so leaving it implicit turns every currency lookup
    // into a NoClassDefFoundError that no compile and no dev run would ever show you.
    //
    // slf4j-api, gson and protobuf-java are deliberately NOT here. Two modules may not export the
    // same package to a third, and the module graph is resolved before the game starts, so getting
    // this wrong is not a crash later — it is a server that never boots. The game already exports
    // slf4j and gson; protobuf is shaded flat into grieflogger's own jar. mysql-connector-j declares
    // protobuf, but only its X DevAPI (mysqlx://) ever touches it — this connects over the classic
    // protocol with a jdbc:mysql:// url, so the driver never loads a byte of it.
    ext.dbLibs = [
            "com.zaxxer:HikariCP:5.1.0",
            "com.mysql:mysql-connector-j:8.3.0",
            "com.h2database:h2:2.2.224",
            "org.flywaydb:flyway-core:10.8.1",
            "org.flywaydb:flyway-mysql:10.8.1",
            "org.jdbi:jdbi3-core:3.45.1",
            "org.jdbi:jdbi3-sqlobject:3.45.1",
            // transitive, named so jar-in-jar actually ships them
            "io.leangen.geantyref:geantyref:1.3.15",          // jdbi3-core, generic type resolution
            "com.fasterxml.jackson.core:jackson-core:2.15.2", // flyway-core
            "com.fasterxml.jackson.core:jackson-databind:2.15.2",
            "com.fasterxml.jackson.core:jackson-annotations:2.15.2",
            "com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.15.2"
    ]

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name "Modmaven"
            url "https://modmaven.dev"
            content {
                includeGroup "dev.technici4n"   // GrandPower
                includeGroup "aztech"            // Modern Industrialization
                includeGroup "net.swedz"         // Tesseract
            }
        }
        maven {
            name = "shedaniel"
            url "https://maven.shedaniel.me"
            content {
                includeGroup "me.shedaniel.cloth" // Cloth Config
                includeGroup "me.shedaniel"       // Roughly Enough Items
                includeGroup "dev.architectury"   // Architectury
            }
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
            content { includeGroup "dev.emi" }    // EMI
        }
        maven {
            url = "https://maven.latvian.dev/releases"
            content { includeGroup "dev.latvian.mods" } // KubeJS & Rhino
        }
        maven { url "https://cursemaven.com" }
        maven {
            name = "FzzyMaven"
            url = "https://maven.fzzyhmstrs.me/"
        }
        maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
        maven { url = "https://maven.firstdark.dev/snapshots" }
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content { includeGroup("software.bernie.geckolib") }
        }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "FTB"
            url = "https://maven.ftb.dev/releases/"
            content { includeGroup "dev.ftb.mods" } // FTB Teams, Quests, Library
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    tasks.processResources {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven { url "file://${rootProject.projectDir}/repo" }
        }
    }
}

// Launches the server and client dev runs in two separate terminal windows so you can watch both
// consoles at once. client and server use separate game dirs (client/run, server/run), so they don't
// clash. Requires a graphical desktop session (uses konsole, falling back to xterm). Once both are up,
// connect the dev client to the server via Multiplayer -> localhost.
tasks.register('runBoth') {
    group = 'roll_mod'
    description = 'Launch :server:runServer and :client:runClient in two separate terminal windows.'
    doLast {
        def root = rootProject.projectDir
        def gw = new File(root, 'gradlew').absolutePath
        def hasKonsole = ['sh', '-c', 'command -v konsole'].execute().waitFor() == 0
        def spawn = { String title, String taskPath ->
            def cmd = hasKonsole
                    ? ['konsole', '--hold', '-p', "tabtitle=$title", '--workdir', root.toString(), '-e', gw, taskPath]
                    : ['xterm', '-title', title, '-hold', '-e', gw, taskPath]
            new ProcessBuilder(cmd).directory(root).start()
        }
        spawn('roll_mod server', ':server:runServer')
        spawn('roll_mod client', ':client:runClient')
    }
}
